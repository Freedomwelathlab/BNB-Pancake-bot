services:
  bot:
    build: .
    container_name: bnb-edge-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DASHBOARD_HOST: 0.0.0.0 # inside the container; published to 127.0.0.1 on the host below
      PRIVATE_KEY_FILE: /run/secrets/hot_wallet_key
    ports:
      - "127.0.0.1:8787:8787" # never expose publicly; use an SSH tunnel
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./backups:/app/backups
    secrets:
      - hot_wallet_key
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

secrets:
  hot_wallet_key:
    # Create this file only for live trading (chmod 600). In paper mode an empty file is fine.
    file: ./secrets/hot_wallet_key
